name: Release

# Builds the installers for Windows, macOS and Linux and uploads them, with the update manifests
# the in-app updater reads, to a DRAFT GitHub release. Publish the draft to make the version live.
#
# Trigger: push a tag vX.Y.Z that matches the version in package.json. `npm run release -- minor`
# (see README "Releasing") bumps, commits, tags and pushes in one go. The workflow can also be run
# by hand from the Actions tab, on that same tag.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  draft:
    name: Draft release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
      - name: Check that the tag matches package.json
        id: meta
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          if [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "::error::package.json says $version, so this workflow must run on tag $tag; it ran on $GITHUB_REF_NAME."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Create the draft release with generated notes (kept as is when it already exists)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="${{ steps.meta.outputs.tag }}"
          if gh release view "$tag" --json isDraft >/dev/null 2>&1; then
            echo "Release $tag already exists; the builds will be uploaded into it."
          else
            gh release create "$tag" --draft --verify-tag --title "Quiver ${{ steps.meta.outputs.version }}" --generate-notes
          fi

  build:
    name: Build (${{ matrix.os }})
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build and upload to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run build && npx electron-builder --publish always

  summary:
    name: Summary
    needs: [draft, build]
    runs-on: ubuntu-latest
    steps:
      - shell: bash
        run: |
          {
            echo "Draft release ready: https://github.com/${{ github.repository }}/releases/tag/${{ needs.draft.outputs.tag }}"
            echo
            echo "Review the notes, then publish it. Installed copies only see published releases."
          } >> "$GITHUB_STEP_SUMMARY"
