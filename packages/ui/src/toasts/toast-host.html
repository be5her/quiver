@if (toasts.toasts().length) {
  <div class="fixed bottom-8 right-3 z-50 flex flex-col gap-2 w-80">
    @for (t of toasts.toasts(); track t.id) {
      <div
        class="flex items-start gap-2 rounded-md border bg-canvas shadow-lg px-3 py-2 text-sm"
        [class]="t.kind === 'error' ? 'border-danger/50' : t.kind === 'success' ? 'border-success/50' : 'border-edge'"
      >
        <svg [qIcon]="icons[t.kind]" class="size-4 mt-0.5 shrink-0" [class]="t.kind === 'error' ? 'text-danger' : t.kind === 'success' ? 'text-success' : 'text-muted'"></svg>
        <span class="flex-1 break-words">{{ t.message }}</span>
        <button type="button" class="text-muted hover:text-fg" (click)="toasts.dismiss(t.id)" aria-label="Dismiss"><svg [qIcon]="closeIcon" class="size-3.5"></svg></button>
      </div>
    }
  </div>
}
