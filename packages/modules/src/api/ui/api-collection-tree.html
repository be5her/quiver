@for (collection of children(); track collection.id) {
  @let open = isOpen(collection);
  <div
    data-testid="api-collection"
    [attr.data-name]="collection.name"
    [attr.data-open]="open ? 'true' : 'false'"
    [attr.data-drop-target]="collection.id"
    [class]="dropTarget() === collection.id ? 'rounded-sm bg-accent/10 outline outline-1 outline-accent/60' : ''"
  >
    <div
      qApiRow
      [depth]="depth()"
      [label]="collection.name"
      bold
      [class.opacity-50]="dragging() === 'collection:' + collection.id"
      (pointerdown)="drag.dnd.pointerDown($event, 'collection:' + collection.id, collection.name)"
      (click)="toggle(collection)"
      (keydown.enter)="toggle(collection)"
      (contextmenu)="collectionMenu($event, collection)"
    >
      <svg rowPrefix [qIcon]="open ? icons.ChevronDown : icons.ChevronRight" class="size-3.5 text-muted"></svg>
      <button qIconButton label="More actions" size="sm" data-testid="api-collection-menu" (click)="collectionMenu($event, collection)"><svg [qIcon]="icons.Ellipsis" class="size-3.5"></svg></button>
    </div>
    @if (open) {
      <q-api-collection-tree [collections]="collections()" [requests]="requests()" [parentId]="collection.id" [depth]="depth() + 1" [filter]="filter()" />
    }
  </div>
}
@for (request of items(); track request.id) {
  @let graphql = request.body.type === 'graphql';
  <div
    qApiRow
    data-testid="api-request-row"
    [attr.data-name]="request.name"
    [depth]="depth()"
    [label]="request.name"
    [active]="activeRequestId() === request.id"
    [attr.title]="summary(request)"
    [class.opacity-50]="dragging() === 'request:' + request.id"
    (pointerdown)="drag.dnd.pointerDown($event, 'request:' + request.id, request.name)"
    (click)="open(request)"
    (keydown.enter)="open(request)"
    (contextmenu)="requestMenu($event, request)"
  >
    <span
      rowPrefix
      class="text-[10px] font-bold w-10 shrink-0 text-right"
      [class]="graphql ? 'text-pink-600 dark:text-pink-400' : methodColors[request.method]"
      [attr.title]="graphql ? 'GraphQL over ' + request.method : null"
    >{{ graphql ? 'GQL' : request.method }}</span>
    <button qIconButton label="More actions" size="sm" data-testid="api-request-menu" (click)="requestMenu($event, request)"><svg [qIcon]="icons.Ellipsis" class="size-3.5"></svg></button>
  </div>
}
