@if (workspace(); as ws) {
  <span class="truncate max-w-md font-mono" [title]="ws.path">{{ ws.path }}</span>
  <q-environment-picker />
} @else {
  <span>No workspace</span>
}
<div class="flex-1"></div>
<q-update-item />
<q-recording-item />
<button type="button" class="flex items-center gap-1 hover:text-fg" [title]="mcp()?.error ?? 'MCP server'" (click)="shell.openSettings()">
  <svg [qIcon]="icons.Plug" class="size-3"></svg>
  <span class="size-1.5 rounded-full" [class]="mcp()?.running ? 'bg-success' : 'bg-danger'"></span>
  MCP {{ mcp()?.running ? ':' + mcp()?.port : 'off' }}</button>
<button type="button" class="hover:text-fg" title="Toggle theme" (click)="shell.toggleTheme()">
  <svg [qIcon]="theme() === 'dark' ? icons.Sun : icons.Moon" class="size-3"></svg>
</button>
