@if (current().tabs.length) {
  <div
    #strip
    class="relative flex items-stretch h-9 border-b border-edge bg-surface overflow-x-auto overflow-y-hidden shrink-0 no-scrollbar"
    [class.cursor-grabbing]="reorder.drag()"
    role="tablist"
    [attr.data-dragging]="reorder.drag()?.id"
    (wheel)="wheel($event)"
  >
    @if (reorder.drag(); as drag) {
      <q-drop-marker axis="x" [at]="drag.marker" testId="tab-drop-marker" />
    }
    @for (tab of current().tabs; track tab.id) {
      @let active = tab.id === current().activeTabId;
      <div
        role="tab"
        [attr.aria-selected]="active"
        tabindex="0"
        class="group flex items-center gap-2 pl-3 pr-1.5 max-w-52 min-w-24 shrink-0 border-r border-edge text-xs cursor-pointer select-none"
        [class]="
          (active ? 'bg-canvas text-fg shadow-[inset_0_2px_0_var(--accent)]' : 'text-muted hover:text-fg hover:bg-elevated/50') +
          (reorder.drag()?.id === tab.id ? ' opacity-50' : '') +
          (reorder.drag() ? ' cursor-grabbing' : '')
        "
        [title]="tab.title"
        data-testid="tab"
        [attr.data-title]="tab.title"
        [attr.data-drag-id]="tab.id"
        (pointerdown)="reorder.pointerDown($event, tab.id)"
        (click)="activate(tab)"
        (keydown.enter)="activate(tab)"
        (auxclick)="auxClick($event, tab)"
        (dblclick)="doubleClick($event, tab)"
        (contextmenu)="showMenu($event, tab)"
      >
        <span class="truncate flex-1">{{ tab.title }}</span>
        @if (tab.dirty && !active) {
          <span class="size-1.5 rounded-full bg-warning shrink-0"></span>
        }
        <button
          type="button"
          aria-label="Close tab"
          class="rounded p-0.5 hover:bg-elevated text-muted hover:text-fg shrink-0"
          [class]="active ? '' : 'opacity-0 group-hover:opacity-100'"
          (click)="close($event, tab)"
        >
          @if (tab.dirty && active) {
            <span class="block size-1.5 m-0.5 rounded-full bg-warning group-hover:hidden"></span>
          }
          <svg [qIcon]="closeIcon" class="size-3" [class]="tab.dirty && active ? 'hidden group-hover:block' : ''"></svg>
        </button>
      </div>
    }
  </div>
}
