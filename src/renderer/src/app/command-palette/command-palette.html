@if (open()) {
  <div class="fixed inset-0 z-40 bg-black/40 flex items-start justify-center pt-[12vh]" (mousedown)="close()">
    <div class="w-[560px] max-w-[92vw] rounded-lg border border-edge bg-canvas shadow-2xl overflow-hidden" (mousedown)="$event.stopPropagation()">
      <div class="palette" role="dialog" aria-label="Command palette" (keydown)="keydown($event)">
        <input
          qAutofocus
          class="palette-input"
          placeholder="Type a command…"
          spellcheck="false"
          autocomplete="off"
          role="combobox"
          aria-expanded="true"
          aria-autocomplete="list"
          [value]="search()"
          (input)="typed($event)"
        />
        <div #list class="palette-list" role="listbox" aria-label="Commands">
          @for (group of shown(); track group.heading) {
            <div role="presentation" data-group>
              <div class="palette-heading" aria-hidden="true" data-heading>{{ group.heading }}</div>
              <div role="group" [attr.aria-label]="group.heading">
                @for (item of group.items; track item.key) {
                  <div
                    class="palette-item"
                    role="option"
                    [attr.aria-selected]="item.key === selected()"
                    [attr.data-selected]="item.key === selected()"
                    [attr.data-key]="item.key"
                    (pointermove)="selected.set(item.key)"
                    (click)="choose(item)"
                  >
                    <span class="flex-1">{{ item.title }}</span>
                    @if (item.shortcut) {
                      <kbd qKbd>{{ item.shortcut }}</kbd>
                    }
                    @if (item.commandId) {
                      <span class="text-[10px] font-mono text-muted">{{ item.commandId }}</span>
                    }
                  </div>
                }
              </div>
            </div>
          } @empty {
            <div class="palette-empty">No matching commands.</div>
          }
        </div>
      </div>
    </div>
  </div>
}
